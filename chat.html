<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Widget (ปรับปรุง)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: 350px;
            max-width: 90%;
        }
        .chat-window {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .chat-window.active {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">



    <div class="chat-container">
        <button id="chatToggle" class="bg-red-500 text-white p-4 rounded-full shadow-lg hover:bg-red-600 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
            </svg>
        </button>

        <div id="chatWindow" class="chat-window bg-white rounded-lg shadow-xl border border-gray-200">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-800">สนับสนุนลูกค้า</h2>
                <button id="closeChat" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div id="chatMessages" class="p-4 h-64 overflow-y-auto space-y-2">
                <!-- ข้อความต้อนรับ -->
            </div>

            <div class="p-4 border-t border-gray-200">
                <div class="flex space-x-2">
                    <input id="chatInput" type="text" placeholder="พิมพ์ข้อความของคุณ..." class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="sendMessage" class="bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 focus:outline-none">
                        ส่ง
                    </button>
                </div>
                <div id="errorMessage" class="text-red-500 text-sm mt-2 hidden">กรุณาพิมพ์ข้อความก่อนส่ง</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let messages = [];
            const chatToggle = document.getElementById('chatToggle');
            const chatWindow = document.getElementById('chatWindow');
            const closeChat = document.getElementById('closeChat');
            const sendMessage = document.getElementById('sendMessage');
            const chatInput = document.getElementById('chatInput');
            const chatMessages = document.getElementById('chatMessages');
            const errorMessage = document.getElementById('errorMessage');

            if (!chatToggle || !chatWindow || !closeChat || !sendMessage || !chatInput || !chatMessages) {
                console.error('One or more elements not found in the DOM');
                return;
            }

            chatToggle.addEventListener('click', () => {
                chatWindow.classList.toggle('active');
            });

            closeChat.addEventListener('click', () => {
                chatWindow.classList.remove('active');
            });

            sendMessage.addEventListener('click', () => {
                const message = chatInput.value.trim();

                if (!message) {
                    errorMessage.classList.remove('hidden');
                    return;
                }

                errorMessage.classList.add('hidden');

                messages.push({ sender: 'คุณ', text: message });
                displayMessages();

                const autoReply = 'ขอบคุณสำหรับข้อความของคุณ! เราจะติดต่อกลับเร็วๆ นี้ หรือช่วยอะไรเพิ่มเติมไหม?';
                messages.push({ sender: 'ฝ่ายสนับสนุน', text: autoReply });
                displayMessages();

                chatInput.value = '';
            });

            function displayMessages() {
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';

                messages.forEach(msg => {
                    const messageElement = document.createElement('div');
                    messageElement.classList.add('p-2', 'rounded-lg', 'max-w-xs');

                    if (msg.sender === 'คุณ') {
                        messageElement.classList.add('bg-blue-100', 'self-end');
                    } else {
                        messageElement.classList.add('bg-gray-100', 'self-start');
                    }

                    messageElement.textContent = `${msg.sender}: ${msg.text}`;
                    chatMessages.appendChild(messageElement);
                });

                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            messages.push({ sender: 'ฝ่ายสนับสนุน', text: 'สวัสดี! ฉันสามารถช่วยอะไรคุณได้บ้าง?' });
            displayMessages();
        });
    </script>

</body>
</html>
