    <button class="back-to-top fixed bottom-6 sm:bottom-8 right-6 sm:right-8 bg-red-600 text-white w-10 sm:w-12 md:w-14 h-10 sm:h-12 md:h-14 rounded-full flex items-center justify-center text-lg sm:text-xl md:text-2xl opacity-0 invisible hover:bg-red-800 transition-all duration-300" onclick="scrollToTop()"><i class="fas fa-chevron-up"></i></button>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.querySelector('#hamburger');
            const navMenu = document.querySelector('#nav-menu');
            if (hamburger && navMenu) {
                hamburger.addEventListener('click', () => {
                    hamburger.classList.toggle('active');
                    navMenu.classList.toggle('hidden');
                    navMenu.classList.toggle('active');
                });

                const navLinks = document.querySelectorAll('#nav-menu ul li a');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        hamburger.classList.remove('active');
                        navMenu.classList.add('hidden');
                        navMenu.classList.remove('active');
                    });
                });
            }

            const backToTopButton = document.querySelector('.back-to-top');
            if (backToTopButton) {
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 300) {
                        backToTopButton.classList.add('show');
                        backToTopButton.classList.remove('opacity-0', 'invisible');
                    } else {
                        backToTopButton.classList.remove('show');
                        backToTopButton.classList.add('opacity-0', 'invisible');
                    }
                });
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
